{% extends 'base.html' %}

{% block title %}Ro‘yxatdan o‘tish | ELECTRO AUTO{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">


        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

            <div class="p-4 p-md-5">

                <div class="text-center mb-4">
                    <div class="mb-3">
                        <i class="bi bi-person-plus-fill fs-1 text-primary"></i>
                    </div>

                    <h2 class="fw-bold">Hisob yaratish</h2>

                    <p class="text-muted">
                        ELECTRO AUTO'ga qo‘shiling
                    </p>
                </div>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Foydalanuvchi nomi
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Username"
                                required
                            >
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Email
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="example@gmail.com"
                            >
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Parol
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Parol"
                                required
                            >
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">
                            Parolni tasdiqlang
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-shield-lock"></i>
                            </span>

                            <input
                                type="password"
                                name="password2"
                                class="form-control"
                                placeholder="Parolni qayta kiriting"
                                required
                            >
                        </div>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100 py-2 fw-semibold"
                    >
                        <i class="bi bi-person-plus me-2"></i>
                        Ro‘yxatdan o‘tish
                    </button>

                </form>

                <div class="text-center mt-4">
                    <span class="text-muted">
                        Hisobingiz bormi?
                    </span>

                    <a
                        href="{% url 'login' %}"
                        class="text-decoration-none fw-semibold"
                    >
                        Kirish
                    </a>
                </div>

            </div>
        </div>

    </div>
</div>


</div>

{% endblock %}
